<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Colors -->
  <defs>
    <linearGradient id="pegShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="pegShadeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="edgeHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Group: center the peg -->
  <g transform="translate(20,2)">
    <!-- Right arm (rear/darker) -->
    <path d="M24 0 L24 60 L20 62 L16 60 L16 0 Z" fill="url(#pegShadeDark)"/>

    <!-- Left arm (front) -->
    <path d="M0 0 L0 60 L4 62 L8 60 L8 0 Z" fill="url(#pegShade)"/>

    <!-- Inner faces forming V-notch -->
    <path d="M8 0 L12 22 L16 0 Z" fill="#1E40AF" fill-opacity="0.9"/>

    <!-- V-notch tip highlight -->
    <path d="M11.2 6 L12 8.4 L12.8 6 Z" fill="#E5F2FF" fill-opacity="0.9"/>

    <!-- Central through hole -->
    <circle cx="12" cy="30" r="3.2" fill="#E6F0FF"/>

    <!-- Bottom circular cutout -->
    <path d="M12 44 a4 4 0 1 0 0 8 a4 4 0 1 0 0 -8 Z" fill="#E6F0FF"/>
    <ellipse cx="12" cy="52" rx="3.2" ry="0.7" fill="#0F172A" opacity="0.15"/>

    <!-- Metal spring (spiral) -->
    <circle cx="12" cy="20" r="3.6" fill="none" stroke="#6B7280" stroke-width="1.6"/>
    <circle cx="12" cy="20" r="2.6" fill="none" stroke="#6B7280" stroke-width="1.6"/>
    <circle cx="12" cy="20" r="1.6" fill="none" stroke="#6B7280" stroke-width="1.6"/>

    <!-- Lever wire going down-left -->
    <path d="M11 22 L4 40" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
    <!-- Small peg on lever -->
    <circle cx="7.6" cy="30.5" r="1.4" fill="#6B7280"/>

    <!-- Small horizontal wire on right arm -->
    <path d="M18.5 36.5 h3.5" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>

    <!-- Highlights on edges -->
    <path d="M1 6 L5 16" stroke="url(#edgeHighlight)" stroke-width="1.2"/>
    <path d="M23 6 L19 16" stroke="#0F172A" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>
</svg>
